name: flutter_template
description: قالب Flutter متعدد المنصات مع هندسة نظيفة ودعم كامل للغة العربية وتعددية اللغات.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة - BLoC Pattern
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # التوجيه المتقدم مع الروابط العميقة
  go_router: ^14.2.7

  # حقن التبعيات
  get_it: ^7.7.0

  # الشبكة والـ HTTP
  dio: ^5.6.0
  connectivity_plus: ^6.0.5

  # التخزين المحلي - Offline First
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # التخزين الآمن
  flutter_secure_storage: ^9.2.2

  # متغيرات البيئة - Zero Hard-coding
  flutter_dotenv: ^5.2.0

  # الصور والأداء
  cached_network_image: ^3.4.1

  # التدويل
  intl: ^0.19.0

  # الاستجابة الكاملة
  flutter_screenutil: ^5.9.3

  # البرمجة الدالية
  dartz: ^0.10.1

  # تسجيل الأحداث
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/translations/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

  generate: true
